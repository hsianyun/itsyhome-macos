# Local Mac Catalyst build with no Apple Developer Program provisioning.
# Keep shared sources and dependencies in project.yml.
include:
  - project.yml

name: ItsyhomeHomeAssistant

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    OTHER_SWIFT_FLAGS: "$(inherited) -D HOME_ASSISTANT_ONLY"

targets:
  Itsyhome:
    supportedDestinations:REPLACE:
      # XcodeGen requires the iOS base platform for a Catalyst target.
      # The build script explicitly selects the Mac Catalyst destination.
      - iOS
      - maccatalyst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsianyun.itsyhome.ha
        # Override XcodeGen's application_iOS iPhone Developer preset.
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: Itsyhome HA
        CURRENT_PROJECT_VERSION: "33003"
        INFOPLIST_KEY_CFBundleDisplayName: Itsyhome HA
        CODE_SIGN_ENTITLEMENTS: Itsyhome/HomeAssistantOnly.entitlements
    # Replace the entire map: an additive merge would retain HomeKit/iCloud.
    entitlements:REPLACE:
      path: Itsyhome/HomeAssistantOnly.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.location: true
  macOSBridge:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsianyun.itsyhome.ha.macOSBridge
        CODE_SIGN_IDENTITY: "-"
  macOSBridgeTests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsianyun.itsyhome.ha.macOSBridgeTests
        CODE_SIGN_IDENTITY: "-"

  HAKeychainProbeBridge:
    type: bundle
    platform: macOS
    sources:
      - Itsyhome/Shared/HATokenStore.swift
      - Itsyhome/HomeAssistant/HATokenStores.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsianyun.itsyhome.ha.keychain-probe.bridge
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: work/HAKeychainProbeBridge/Info.plist
      properties:
        NSPrincipalClass: $(PRODUCT_MODULE_NAME).HALoginKeychainTokenStore

  HAKeychainProbe:
    type: application
    platform: iOS
    supportedDestinations: [iOS, maccatalyst]
    sources:
      - tools/HAKeychainProbe
      - Itsyhome/Shared/HATokenStore.swift
      - Itsyhome/HomeAssistant/HATokenStores.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsianyun.itsyhome.ha.keychain-probe
        SUPPORTS_MACCATALYST: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Itsyhome/HomeAssistantOnly.entitlements
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "6"
    info:
      path: work/HAKeychainProbe/Info.plist
      properties:
        LSUIElement: true
        UILaunchScreen: {}
    scheme: {}
    dependencies:
      - target: HAKeychainProbeBridge
        platformFilter: maccatalyst
        embed: true
        codeSign: true
        copyPhase:
          destination: plugins
