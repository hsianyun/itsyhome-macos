name: Home Assistant local build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify credentials in a locally signed Catalyst app
        run: ./scripts/test-ha-credentials.sh
      - name: Verify settings interactions
        run: |
          xcodebuild test \
            -project ItsyhomeHomeAssistant.xcodeproj \
            -scheme Itsyhome \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath build/credential-probe \
            -only-testing:macOSBridgeTests/SettingsInteractionTests

  build:
    needs: credentials
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, verify local signing and test
        run: ./scripts/build-home-assistant.sh --test

      - name: Upload locally signed Mac application
        uses: actions/upload-artifact@v4
        with:
          name: Itsyhome-HA
          path: build/home-assistant/Itsyhome-HA.zip
          if-no-files-found: error

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-test-results
          path: build/home-assistant/*.xcresult
          if-no-files-found: ignore
